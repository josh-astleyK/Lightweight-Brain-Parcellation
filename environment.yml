name: brain-parc
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - conda-forge::nibabel>=3.2
  - conda-forge::scipy>=1.10
  - conda-forge::numpy>=1.24
  - pip:
    # For GPU: install torch with CUDA support from https://pytorch.org/get-started/locally/
    # e.g.  pip install torch --index-url https://download.pytorch.org/whl/cu121
    # For CPU only:
    - torch>=2.1
    - monai>=1.3,<1.4
    - dynamic-network-architectures>=0.3
    # mamba-ssm and causal-conv1d must be installed separately after activating this env.
    # See README Installation section for platform-specific instructions.
